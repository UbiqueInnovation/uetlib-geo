syntax = "proto3";

package ch.ubique.geo;

option optimize_for = SPEED;

// Java specific options
option java_multiple_files = true;
option java_package = "ch.ubique.uetlib.geo.graph.routing.protobuf";
option java_outer_classname = "RoutingGraphTileProtos";


message RoutingGraphTile {
  repeated VertexCoordinate coordinates = 1;
  repeated Vertex vertices = 2;

  message Vertex {
    int32 identifier = 1;
    repeated Neighbor neighbors = 2;
    repeated RoutingNeighbor routingNeighbors = 3;
    bool isHighway = 4;
  }

  message VertexCoordinate {
    int32 identifier = 1;
    float x = 2;
    float y = 3;
    optional float elevation = 4;
  }

  enum SurfaceType {
    UNKNOWN = 0;
    HARD = 1;
    NATURE = 2;
  }

  message Neighbor {
    int32 identifier = 1;
    float weight = 2;
    bool isHighway = 3;
    optional SurfaceType surfaceType = 4;
  }

  message RoutingNeighbor {
    int32 identifier = 1;
    float weight = 2;
    int32 direction = 3; // the direction is the identifier of a neighbor in which we can reach this routing neighbor
    bool isHighway = 4;
  }
}